<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>خريطتي</title>
<link rel="manifest" href="manifest.webmanifest"><script>if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--ink:#14213D;--deep:#0B1730;--teal:#13A3A8;--gold:#E3A62B;--bg:#F5F8FA;--line:#DDE5EA;--muted:#5E6E7E;--red:#D64545;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;touch-action:manipulation}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#map{position:absolute;inset:0}.leaflet-container{font-family:inherit;background:#e9eef1}
.leaflet-popup-content-wrapper{border-radius:16px}.leaflet-popup-content{margin:12px 14px}
/* splash */
.splash{position:fixed;inset:0;z-index:5000;background:linear-gradient(180deg,#0B1730 0%,#14213D 48%,#0f6f78 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px calc(var(--sb) + 36px);transition:opacity .5s}
.splash.out{opacity:0;pointer-events:none}
.ill{position:absolute;top:12%;left:0;right:0;width:100%;max-height:46%}
.splash h1{font-size:42px;margin:0 0 4px}.splash p{margin:0 0 22px;color:#bfe3e5;font-size:16px;text-align:center}
.go-big{background:var(--gold);color:var(--ink);font-weight:700;font-size:18px;border-radius:18px;padding:15px 46px;box-shadow:0 8px 22px rgba(227,166,43,.4)}
@keyframes drive{from{transform:translateX(-70px)}to{transform:translateX(400px)}}.drive{animation:drive 6s linear infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes dashm{to{stroke-dashoffset:-32}}.dash{animation:dashm 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}path.flow{stroke-dasharray:4 14;animation:flow 1.1s linear infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
/* top */
.top{position:absolute;z-index:1000;top:calc(var(--st) + 10px);left:10px;right:10px}
.srow{display:flex;gap:10px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:#fff;border-radius:28px;padding:0 16px;height:54px;box-shadow:0 4px 18px rgba(20,33,61,.22)}
.search svg{color:var(--teal)}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;background:transparent;color:var(--ink);height:100%}
.search input::placeholder{color:#8795a3}
#qx{background:var(--bg);width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;color:var(--muted)}
.rb{width:54px;height:54px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(20,33,61,.25);color:var(--ink);flex:none}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chip{flex:none;background:#fff;border-radius:20px;padding:9px 15px;font-size:14px;font-weight:500;box-shadow:0 2px 10px rgba(20,33,61,.18)}
.chip.on{background:var(--ink);color:#fff}
.fabr{position:absolute;z-index:1000;right:10px;top:calc(var(--st) + 140px)}.fabr .rb{color:var(--teal)}
body.nav .fabr{top:calc(var(--st) + 120px)}body.nav .top{display:none}
.speed{position:absolute;z-index:1000;left:10px;top:calc(var(--st) + 140px);width:66px;height:66px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(20,33,61,.3)}
body.nav .speed{top:calc(var(--st) + 120px)}.speed b{font-size:22px;line-height:1}.speed small{font-size:10px;color:var(--muted)}
.banner{position:absolute;z-index:1000;top:calc(var(--st) + 10px);left:10px;right:10px;background:var(--deep);color:#fff;border-radius:20px;padding:12px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#bArrow{width:54px;height:54px;border-radius:16px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
#bText{font-weight:700;font-size:18px;line-height:1.35}#bDist{color:#9fd9db;margin-top:2px;font-size:15px}
/* dock */
.dock{position:absolute;z-index:1000;left:10px;right:10px;bottom:calc(var(--sb) + 10px);height:66px;background:#fff;border-radius:26px;display:flex;align-items:center;box-shadow:0 6px 24px rgba(20,33,61,.3)}
body.nav .dock{display:none}
.dk{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
.dk svg{width:24px;height:24px}.dk.on{color:var(--teal)}
.dk.fab{flex:none;width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--ink);transform:translateY(-16px);box-shadow:0 8px 18px rgba(227,166,43,.55);margin:0 4px;font-weight:700}
/* card */
.card{position:absolute;z-index:1000;left:10px;right:10px;bottom:calc(var(--sb) + 88px);background:#fff;border-radius:22px;padding:14px;box-shadow:0 6px 24px rgba(20,33,61,.35)}
body.nav .card{bottom:calc(var(--sb) + 14px)}
.card .t{font-weight:700;font-size:17px;line-height:1.4}.card .s{color:var(--muted);font-size:14px;margin-top:3px}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;background:var(--bg);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;gap:2px;align-items:center;border:2px solid transparent}
.tab b{font-size:15px}.tab span{font-size:13px;color:var(--muted)}.tab.on{border-color:var(--teal);background:#e7f6f6}.tab.on span{color:var(--ink)}.tab:disabled{opacity:.45}
.alts{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.alt{flex:none;background:var(--bg);border-radius:12px;padding:7px 12px;font-size:13px;border:2px solid transparent}.alt.on{border-color:#7b8a99;background:#fff;font-weight:700}
.warn{margin-top:8px;background:#fff4e0;color:#8a5a00;border-radius:12px;padding:8px 12px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;margin-top:12px}
.btn{border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;min-height:46px}
.btn.go{background:var(--teal);color:#fff;flex:1}.btn.alt2{background:#e7f6f6;color:#0b6d71}.btn.red{background:#fde8e8;color:#a52d2d}.btn.ghost{color:var(--muted)}.btn.gold{background:var(--gold);color:var(--ink);flex:1}
/* sheets */
.bd{position:absolute;inset:0;z-index:1090;background:rgba(11,23,48,.45)}
.sheet{position:absolute;z-index:1100;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:10px 16px calc(var(--sb) + 18px);box-shadow:0 -6px 28px rgba(0,0,0,.28);transform:translateY(110%);transition:transform .25s;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet:before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh{display:flex;align-items:center;justify-content:space-between}.sh h2{margin:0;font-size:19px}
.x{width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:20px;line-height:1;color:var(--muted)}
.sheet h3{margin:14px 0 8px;font-size:14px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--bg);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:500;font-size:13px;text-align:center}
.tile i{font-style:normal;font-size:24px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lc{background:var(--bg);border-radius:18px;padding:8px;text-align:right;border:2px solid transparent}.lc.on{border-color:var(--teal);background:#e7f6f6}
.lc b{display:block;font-size:15px}.lc small{color:var(--muted);font-size:12px}
.th{width:100%;height:64px;border-radius:12px;display:block;margin-bottom:6px;border:1px solid var(--line)}
.th-street{background:linear-gradient(135deg,#eef1ea 0 40%,#fff 40% 46%,#cfe5d6 46%)}
.th-sat{background:linear-gradient(135deg,#2f4a2d,#56733f 50%,#8a7a52)}
.th-hybrid{background:linear-gradient(135deg,#2f4a2d,#56733f 50%,#8a7a52);box-shadow:inset 0 0 0 4px rgba(255,255,255,.4)}
.th-terrain{background:linear-gradient(135deg,#d9c9a0,#a9c58a 55%,#7aa07a)}.th-dark{background:linear-gradient(135deg,#0B1730,#1d3557)}
.fc{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.fc button{background:var(--bg);border-radius:18px;padding:9px 14px;font-size:14px;border:1.5px solid transparent;display:flex;align-items:center;gap:6px}
.fc button.on{border-color:var(--ink);background:#fff;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item .nm{flex:1;min-width:0}.item .nm b{display:block;font-weight:500;line-height:1.4}.item .nm small{color:var(--muted);font-size:12px}
.item .em{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.sm{background:#e7f6f6;color:#0b6d71;border-radius:12px;padding:9px 13px;font-size:14px;flex:none}.sm.del{background:#fde8e8;color:#a52d2d}
.empty{text-align:center;color:var(--muted);padding:18px 0}.empty svg{width:70px;height:70px;stroke:#b9c6cf;margin-bottom:6px}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;margin-top:8px;background:#fff;color:var(--ink)}
textarea.field{min-height:84px;resize:none}
.sv{display:inline-block;color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;margin-right:4px}
.pop{min-width:170px}.pop b{font-weight:700}.pop small{color:var(--muted)}.pop p{margin:6px 0 0;font-size:14px}
.pop button{margin:8px 0 0 6px;background:var(--teal);color:#fff;border-radius:10px;padding:9px 12px;font-size:14px}.pop button.s{background:#e7f6f6;color:#0b6d71}.pop button.r{background:#fde8e8;color:#a52d2d}
.mk{width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.4)}
.car{position:relative;width:44px;height:44px}.car svg{width:44px;height:44px;transition:transform .4s;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.pulse{position:absolute;inset:4px;border-radius:50%;background:rgba(19,163,168,.35);animation:pulse 2s ease-out infinite}
.set label.r{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.set input[type=range]{width:55%;accent-color:#13A3A8}.set select{max-width:58%;border:1.5px solid var(--line);border-radius:10px;padding:8px;font:inherit;background:#fff}
.set input[type=checkbox]{width:44px;height:26px;accent-color:#13A3A8}.hint{background:#fff4e0;color:#8a5a00;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px}
.toast{position:absolute;z-index:1300;top:calc(var(--st) + 132px);left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;max-width:92%;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.35)}
body.nav .toast{top:calc(var(--st) + 100px)}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:4000;animation:fall 2.8s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>

<svg class="ill" viewBox="0 0 360 240" aria-hidden="true">
<circle cx="296" cy="46" r="22" fill="#E3A62B" opacity=".92"/>
<g fill="#10294d"><rect x="10" y="110" width="40" height="92"/><rect x="58" y="78" width="34" height="124"/><rect x="100" y="126" width="44" height="76"/><rect x="152" y="66" width="38" height="136"/><rect x="198" y="104" width="46" height="98"/><rect x="252" y="90" width="36" height="112"/><rect x="296" y="120" width="50" height="82"/></g>
<g fill="#E3A62B" opacity=".85"><rect x="18" y="122" width="7" height="9"/><rect x="34" y="140" width="7" height="9"/><rect x="66" y="92" width="7" height="9"/><rect x="78" y="116" width="7" height="9"/><rect x="108" y="140" width="7" height="9"/><rect x="160" y="84" width="7" height="9"/><rect x="174" y="112" width="7" height="9"/><rect x="206" y="120" width="7" height="9"/><rect x="224" y="146" width="7" height="9"/><rect x="260" y="106" width="7" height="9"/><rect x="304" y="136" width="7" height="9"/></g>

<button class="go-big" id="sBtn">ابدأ الرحلة</button>
</div>

<div id="map"></div>

<div class="top">
<div class="srow">
<form class="search" id="searchForm" autocomplete="off">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input id="q" type="search" placeholder="إلى أين تريد الذهاب؟" enterkeyhint="search" aria-label="بحث">
<button type="button" id="qx" aria-label="مسح" hidden>×</button>
</form>
<button class="rb" id="layersBtn" aria-label="نمط الخريطة"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
</div>
<div class="chips">
<button class="chip" data-poi="hospital">🏥 مستشفيات</button>
<button class="chip" data-poi="police">🚓 مراكز الشرطة</button>
</div>
</div>

<div class="banner" id="banner" hidden><div id="bArrow">↑</div><div><div id="bText"></div><div id="bDist"></div></div></div>
<div class="fabr"><button class="rb" id="locate" aria-label="موقعي"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button></div>
<div class="speed" id="speed" hidden><b id="spd">٠</b><small>كم/س</small></div>
<div class="card" id="card" hidden></div>
<div class="toast" id="toast" hidden></div>

<nav class="dock">
<button class="dk" id="dkFavs"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/></svg>أماكني</button>
<button class="dk" id="dkReps"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.5M3 12h.5M3 18h.5"/></svg>البلاغات</button>
<button class="dk fab" id="dkReport" aria-label="إبلاغ"><svg viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg></button>
<button class="dk" id="dkVoice"><svg viewBox="0 0 24 24" id="vIc"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg><span id="vLb">الصوت</span></button>
<button class="dk" id="dkSet"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3h0a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5h0a1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8v0a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>الإعدادات</button>
</nav>

<div class="bd" id="bd" hidden></div>
